<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한중 한국어 공부방</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">🇰🇷 한중 한국어 공부방 🇨🇳</div>
    <p>중국어로 쉽고 재미있게 배우는 한국어</p>
  </header>
  <main>
    <!-- 소개 -->
    <section class="hero">
      <span class="badge">
        Korean Study
      </span>
      <h1>
        🌈 재미있는 한국어 공부
      </h1>
      <p>
        단어도 배우고, 문장도 배우고,
        직접 써봐요!
      </p>
    </section>
    <!-- 레벨 선택 -->
    <section class="levels">
      <h2>
        ⭐ 레벨을 선택하세요
      </h2>
      <button class="level" onclick="showLevel(1)">
        🐣 레벨 1
        <br>
        <small>처음 배우는 한국어</small>
      </button>
      <button class="level" onclick="showLevel(2)">
        🐥 레벨 2
        <br>
        <small>쉬운 단어와 문장</small>
      </button>
      <button class="level" onclick="showLevel(3)">
        🦊 레벨 3
        <br>
        <small>조금 더 어려운 한국어</small>
      </button>
    </section>
    <!-- 공부 메뉴 -->
    <section id="content" class="content">
      <h2>
        📚 공부할 내용을 선택하세요
      </h2>
      <button
        class="big-button"
        onclick="showWords()">
        🧸 단어 공부하기
      </button>
      <button
        class="big-button"
        onclick="showSentences()">
        💬 문장 공부하기
      </button>
    </section>
  </main>
  <!-- JavaScript -->
  <script src="script.js"></script>
</body>
</html>
